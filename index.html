<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Pack Luck Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>FC Pack Luck Tracker</h1>
        <form id="pack-form">
            <input type="text" id="packType" placeholder="Pack Type" required>
            <input type="text" id="contents" placeholder="Contents" required>
            <input type="date" id="openedDate" required>
            <button type="submit">Log Pack</button>
        </form>
        <h2>Pack Log</h2>
        <ul id="pack-log"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
