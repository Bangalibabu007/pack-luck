<!DOCTYPE html>
<html>
<head>
    <title>AI Chat Demo</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-box { width: 400px; background: #16213e; border-radius: 10px; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #chatlog { height: 300px; overflow-y: auto; background: #0f3460; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 15px; max-width: 80%; clear: both; }
        .user { background: #533483; float: right; }
        .ai { background: #e94560; float: left; }
        input { width: calc(100% - 70px); padding: 10px; border: none; border-radius: 20px; background: #0f3460; color: white; }
        button { padding: 10px 15px; border: none; border-radius: 20px; background: #e94560; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-box">
        <div id="chatlog"></div>
        <input type="text" id="userInput" placeholder="Type a message...">
        <button id="sendBtn">Send</button>
    </div>
    <script>
        const chatlog = document.getElementById('chatlog');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', sender);
            msgDiv.textContent = text;
            chatlog.appendChild(msgDiv);
            chatlog.scrollTop = chatlog.scrollHeight;
        }

        function aiReply(userText) {
            // Simple hardcoded replies
            const replies = [
                "That's interesting! Tell me more.",
                "I understand. Go on.",
                "Hmm, let me think about that.",
                "You're awesome!",
                "I'm here to help."
            ];
            return replies[Math.floor(Math.random() * replies.length)];
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            setTimeout(() => {
                const reply = aiReply(text);
                addMessage(reply, 'ai');
            }, 500);
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial AI greeting
        addMessage("Hello! I'm an AI. Type something below.", 'ai');
    </script>
</body>
</html>
