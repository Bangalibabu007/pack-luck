<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC TeamRank - Squad Rating & Analysis</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: rgba(22, 22, 31, 0.85);
            --bg-card-hover: rgba(30, 30, 42, 0.9);
            --border: #2a2a3a;
            --border-light: #3a3a4a;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a80;
            --accent: #6c5ce7;
            --accent2: #4facfe;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --radius: 12px;
            --radius-sm: 8px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.6);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4a5a; }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* Navigation */
        .nav-bar {
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
        }
        .nav-logo .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #a78bfa, #6c5ce7);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }
        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-links a {
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
        }
        .nav-links a:hover, .nav-links a.active {
            background: var(--bg-panel);
            color: var(--text-primary);
        }
        .nav-links a.active {
            background: var(--accent);
            color: #fff;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover {
            border-color: var(--border-light);
            box-shadow: var(--shadow-lg);
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .icon {
            font-size: 20px;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background: var(--bg-panel-hover);
            border-color: var(--border-light);
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* Inputs */
        input, select, textarea {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 10px 12px;
            font-size: 14px;
            transition: var(--transition);
            outline: none;
            width: 100%;
            font-family: var(--font);
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group { margin-bottom: 16px; }

        /* Grid */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        @media (max-width: 900px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }

        /* Score Circle */
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) var(--score-angle, 0deg), #2a2a3a 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0 auto;
        }
        .score-circle .score-inner {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .score-circle .score-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }
        .score-circle .score-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Pitch */
        .pitch {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            aspect-ratio: 3/4;
            background: linear-gradient(180deg, #1a4a1a 0%, #0d330d 100%);
            border-radius: 8px;
            border: 2px solid #2a5a2a;
            overflow: hidden;
        }
        .pitch-lines {
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(to right, transparent 49.5%, rgba(255,255,255,0.2) 50%, transparent 50.5%),
                linear-gradient(to bottom, transparent 49.5%, rgba(255,255,255,0.2) 50%, transparent 50.5%);
            opacity: 0.3;
        }
        .player-dot {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 2;
            text-align: center;
            line-height: 1;
        }
        .player-dot.excellent { border-color: #2ecc71; background: rgba(46,204,113,0.3); }
        .player-dot.good { border-color: #3498db; background: rgba(52,152,219,0.3); }
        .player-dot.average { border-color: #f39c12; background: rgba(243,156,18,0.3); }
        .player-dot.weak { border-color: #e74c3c; background: rgba(231,76,60,0.3); }
        .player-dot:hover { transform: scale(1.2); z-index: 5; }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-elite { background: rgba(46,204,113,0.2); color: #2ecc71; }
        .badge-world { background: rgba(52,152,219,0.2); color: #3498db; }
        .badge-excellent { background: rgba(155,89,182,0.2); color: #9b59b6; }
        .badge-strong { background: rgba(241,196,15,0.2); color: #f1c40f; }
        .badge-good { background: rgba(230,126,34,0.2); color: #e67e22; }
        .badge-average { background: rgba(149,165,166,0.2); color: #95a5a6; }
        .badge-weak { background: rgba(231,76,60,0.2); color: #e74c3c; }

        /* Tables */
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .table th {
            text-align: left;
            padding: 10px 12px;
            background: var(--bg-input);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }
        .table tr:hover td { background: var(--bg-panel); }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            z-index: 999;
            transition: transform 0.3s ease;
            font-size: 14px;
            white-space: nowrap;
        }
        .toast.visible { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .container { padding: 10px; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .pitch { max-width: 100%; }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease; }
        .hidden { display: none !important; }

        /* Player input rows */
        .player-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .player-row input, .player-row select {
            flex: 1;
            min-width: 80px;
        }
        .player-row .btn-remove {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation -->
    <nav class="nav-bar">
        <a href="#" class="nav-logo">
            <span class="logo-icon">F</span>
            FC TeamRank
        </a>
        <div class="nav-links" id="navLinks">
            <a href="#" data-page="dashboard" class="active">Dashboard</a>
            <a href="#" data-page="myteam">My Team</a>
            <a href="#" data-page="analyze">Analyze</a>
            <a href="#" data-page="compare">Compare</a>
            <a href="#" data-page="rankings">Rankings</a>
            <a href="#" data-page="history">History</a>
        </div>
    </nav>

    <div class="container" id="appContainer">
        <!-- Pages will be rendered here dynamically -->
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // =====================================================
        // FC TeamRank - Full Application Logic
        // =====================================================

        // ---------- DATA MODELS ----------
        const POSITIONS = ['GK', 'CB', 'LB', 'RB', 'CDM', 'CM', 'CAM', 'LW', 'RW', 'ST'];
        const FORMATIONS = ['4-3-3', '4-2-3-1', '4-4-2', '4-2-2-2', '4-1-2-1-2', '3-5-2', '3-4-3', '5-2-3', '5-3-2', '4-3-2-1', '3-4-2-1', '4-5-1', '5-4-1'];

        // Player attributes relevant to each position
        const POSITION_ATTRIBUTES = {
            'ST': ['finishing', 'shooting', 'pace', 'physical'],
            'LW': ['pace', 'dribbling', 'passing', 'finishing'],
            'RW': ['pace', 'dribbling', 'passing', 'finishing'],
            'CAM': ['passing', 'dribbling', 'shooting'],
            'CM': ['passing', 'stamina', 'defending', 'dribbling'],
            'CDM': ['defending', 'physical', 'passing'],
            'CB': ['defending', 'physical', 'pace'],
            'LB': ['pace', 'defending', 'stamina'],
            'RB': ['pace', 'defending', 'stamina'],
            'GK': ['diving', 'handling', 'reflexes', 'positioning']
        };

        // Default attribute values for simulation if not provided
        const DEFAULT_ATTRS = { pace: 80, shooting: 80, passing: 80, dribbling: 80, defending: 80, physical: 80, stamina: 80, finishing: 80, diving: 80, handling: 80, reflexes: 80, positioning: 80 };

        // Rating weights
        const WEIGHTS = {
            teamOVR: 0.25,
            startingXI: 0.30,
            positionStrength: 0.15,
            keyAttributes: 0.10,
            squadBalance: 0.10,
            squadDepth: 0.05,
            synergy: 0.05
        };

        // ---------- STATE ----------
        let currentTeam = null;
        let teams = JSON.parse(localStorage.getItem('fcTeamRank_teams') || '[]');
        let analyses = JSON.parse(localStorage.getItem('fcTeamRank_analyses') || '[]');
        let currentPage = 'dashboard';

        // ---------- UTILITY FUNCTIONS ----------
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        function saveTeams() {
            localStorage.setItem('fcTeamRank_teams', JSON.stringify(teams));
        }

        function saveAnalyses() {
            localStorage.setItem('fcTeamRank_analyses', JSON.stringify(analyses));
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} visible`;
            setTimeout(() => {
                toast.classList.remove('visible');
            }, 3000);
        }

        function formatPercentile(p) {
            if (p >= 99) return '99+';
            return Math.floor(p).toString();
        }

        function getTier(score) {
            if (score >= 95) return { name: 'Elite', class: 'badge-elite' };
            if (score >= 90) return { name: 'World Class', class: 'badge-world' };
            if (score >= 85) return { name: 'Excellent', class: 'badge-excellent' };
            if (score >= 80) return { name: 'Strong', class: 'badge-strong' };
            if (score >= 75) return { name: 'Good', class: 'badge-good' };
            if (score >= 70) return { name: 'Average', class: 'badge-average' };
            if (score >= 60) return { name: 'Below Average', class: 'badge-weak' };
            return { name: 'Weak', class: 'badge-weak' };
        }

        // ---------- RATING ENGINE ----------
        function calculateTeamRating(team) {
            // team: { name, formation, overall, players: [{name, position, ovr, baseOvr, rank, training, attributes, playstyle}] }
            
            const startingXI = team.players.filter(p => p.isStarter !== false); // Assume all are starters unless marked
            const bench = team.players.filter(p => p.isStarter === false);
            if (startingXI.length === 0) {
                // If no bench distinction, use all as starters and bench empty
                // This is a fallback
                if (team.players.length > 0) {
                    startingXI.length = 0;
                    team.players.forEach(p => startingXI.push(p));
                }
            }
            
            // 1. Team OVR Score (weight: 0.25)
            const teamOVR = parseFloat(team.overall) || 0;
            const teamOVRScore = Math.min(100, (teamOVR - 70) * (100 / 30)); // assume 70-100 scale to 0-100
            const clampedTeamOVRScore = Math.max(0, Math.min(100, teamOVRScore));
            
            // 2. Starting XI Player Quality (weight: 0.30)
            const starterOVRs = startingXI.map(p => p.ovr);
            const avgStarterOVR = starterOVRs.length > 0 ? starterOVRs.reduce((a,b)=>a+b,0)/starterOVRs.length : 0;
            const starterOVRScore = Math.min(100, (avgStarterOVR - 70) * (100 / 30));
            const clampedStarterOVRScore = Math.max(0, Math.min(100, starterOVRScore));
            
            // 3. Position Strength (weight: 0.15)
            // For each player, check if position matches natural position; penalize if not.
            // Also detect weak positions based on OVR relative to team average.
            let posScoreSum = 0;
            let posCount = 0;
            const teamAvgOVR = avgStarterOVR || teamOVR;
            startingXI.forEach(player => {
                let posScore = 100;
                // Check if player's position is in allowed list for formation? We'll assume all positions are valid
                // Penalize if player OVR is significantly below team average in their position
                const diff = teamAvgOVR - player.ovr;
                if (diff > 5) {
                    posScore -= (diff - 5) * 2; // penalty
                }
                // Out-of-position penalty (based on player's declared position vs actual position played? We'll simulate by checking if player's position matches a preset natural position for their role)
                // For simplicity, we'll assume all positions entered are correct. We can add later.
                posScoreSum += posScore;
                posCount++;
            });
            const avgPositionScore = posCount > 0 ? posScoreSum / posCount : 0;
            const clampedPositionScore = Math.max(0, Math.min(100, avgPositionScore));
            
            // 4. Key Attributes (weight: 0.10)
            // Calculate average of relevant attributes for each player based on position.
            let attrScoreSum = 0;
            let attrCount = 0;
            startingXI.forEach(player => {
                const pos = player.position;
                const attrs = POSITION_ATTRIBUTES[pos] || ['pace','shooting','passing','dribbling','defending','physical'];
                let attrAvg = 0;
                attrs.forEach(attr => {
                    const val = player.attributes && player.attributes[attr] ? player.attributes[attr] : DEFAULT_ATTRS[attr] || 80;
                    attrAvg += val;
                });
                attrAvg /= attrs.length;
                const attrScore = Math.min(100, Math.max(0, attrAvg));
                attrScoreSum += attrScore;
                attrCount++;
            });
            const avgAttrScore = attrCount > 0 ? attrScoreSum / attrCount : 0;
            
            // 5. Squad Balance (weight: 0.10)
            // Analyze weaknesses: weak positions, weak GK, etc.
            let balanceScore = 100;
            const gk = startingXI.find(p => p.position === 'GK');
            if (!gk || gk.ovr < teamAvgOVR - 5) balanceScore -= 10;
            const cbs = startingXI.filter(p => p.position === 'CB');
            if (cbs.length < 2) balanceScore -= 5;
            else {
                const cbAvg = cbs.reduce((a,b)=>a+b.ovr,0)/cbs.length;
                if (cbAvg < teamAvgOVR - 3) balanceScore -= 10;
            }
            const fullbacks = startingXI.filter(p => p.position === 'LB' || p.position === 'RB');
            if (fullbacks.length < 2) balanceScore -= 5;
            else {
                const fbAvg = fullbacks.reduce((a,b)=>a+b.ovr,0)/fullbacks.length;
                if (fbAvg < teamAvgOVR - 3) balanceScore -= 8;
            }
            const midfielders = startingXI.filter(p => ['CM','CDM','CAM'].includes(p.position));
            if (midfielders.length < 2) balanceScore -= 5;
            const attackers = startingXI.filter(p => ['ST','LW','RW','CF'].includes(p.position));
            if (attackers.length < 1) balanceScore -= 10;
            balanceScore = Math.max(0, Math.min(100, balanceScore));
            
            // 6. Squad Depth (weight: 0.05)
            let depthScore = 0;
            if (bench.length > 0) {
                const benchOVRs = bench.map(p => p.ovr);
                const benchAvg = benchOVRs.reduce((a,b)=>a+b,0)/benchOVRs.length;
                depthScore = Math.min(100, (benchAvg - 60) * (100 / 40)); // scale 60-100 to 0-100
            } else {
                depthScore = 30; // no bench
            }
            depthScore = Math.max(0, Math.min(100, depthScore));
            
            // 7. Team Synergy/Consistency (weight: 0.05)
            // Reward consistent OVRs, penalize huge variance
            const allOVRs = [...startingXI.map(p=>p.ovr), ...bench.map(p=>p.ovr)];
            const avgAll = allOVRs.length > 0 ? allOVRs.reduce((a,b)=>a+b,0)/allOVRs.length : 0;
            const variance = allOVRs.reduce((acc, ovr) => acc + (ovr - avgAll) ** 2, 0) / (allOVRs.length || 1);
            const stdDev = Math.sqrt(variance);
            let synergyScore = 100 - stdDev * 2; // lower variance = higher score
            synergyScore = Math.max(0, Math.min(100, synergyScore));
            
            // Weighted total
            const totalScore = 
                clampedTeamOVRScore * WEIGHTS.teamOVR +
                clampedStarterOVRScore * WEIGHTS.startingXI +
                clampedPositionScore * WEIGHTS.positionStrength +
                avgAttrScore * WEIGHTS.keyAttributes +
                balanceScore * WEIGHTS.squadBalance +
                depthScore * WEIGHTS.squadDepth +
                synergyScore * WEIGHTS.synergy;
            
            const finalScore = Math.round(totalScore * 10) / 10;
            
            // Calculate category scores for display
            const attackPlayers = startingXI.filter(p => ['ST','LW','RW','CF'].includes(p.position));
            const midfieldPlayers = startingXI.filter(p => ['CM','CDM','CAM'].includes(p.position));
            const defensePlayers = startingXI.filter(p => ['CB','LB','RB','WB'].includes(p.position));
            const gkPlayer = startingXI.find(p => p.position === 'GK');
            
            function categoryScore(players) {
                if (!players || players.length === 0) return 0;
                const avgOvr = players.reduce((a,b)=>a+b.ovr,0)/players.length;
                // Blend with attributes
                let attrTotal = 0, attrCount = 0;
                players.forEach(p => {
                    const posAttrs = POSITION_ATTRIBUTES[p.position] || ['pace','shooting','passing','dribbling','defending','physical'];
                    posAttrs.forEach(attr => {
                        attrTotal += (p.attributes && p.attributes[attr]) ? p.attributes[attr] : DEFAULT_ATTRS[attr] || 80;
                        attrCount++;
                    });
                });
                const attrAvg = attrCount > 0 ? attrTotal / attrCount : 80;
                const weighted = avgOvr * 0.7 + attrAvg * 0.3;
                return Math.min(100, Math.max(0, (weighted - 60) * (100 / 40)));
            }
            
            const attackScore = Math.round(categoryScore(attackPlayers) * 10) / 10;
            const midfieldScore = Math.round(categoryScore(midfieldPlayers) * 10) / 10;
            const defenseScore = Math.round(categoryScore(defensePlayers) * 10) / 10;
            const gkScore = gkPlayer ? Math.round(categoryScore([gkPlayer]) * 10) / 10 : 0;
            
            // Weakness detection
            const weaknesses = [];
            // Find lowest rated starter
            const sortedStarters = [...startingXI].sort((a,b) => a.ovr - b.ovr);
            if (sortedStarters.length > 0) {
                const weakest = sortedStarters[0];
                weaknesses.push(`${weakest.position} (${weakest.name}) is ${Math.round(teamAvgOVR - weakest.ovr)} points below squad average`);
            }
            // Check GK
            if (gkPlayer && gkPlayer.ovr < teamAvgOVR - 3) weaknesses.push('Weak goalkeeper');
            // Check CBs
            if (cbs.length > 0) {
                const cbAvg = cbs.reduce((a,b)=>a+b.ovr,0)/cbs.length;
                if (cbAvg < teamAvgOVR - 3) weaknesses.push('Center-backs are below squad level');
            }
            // Check pace for fullbacks
            fullbacks.forEach(fb => {
                const pace = fb.attributes?.pace || DEFAULT_ATTRS.pace;
                if (pace < 75) weaknesses.push(`${fb.position} ${fb.name} lacks pace`);
            });
            
            // Upgrade recommendation
            let upgradeRecommendation = '';
            if (weaknesses.length > 0) {
                const firstWeakness = weaknesses[0];
                upgradeRecommendation = `Priority: Address ${firstWeakness}. Look for higher OVR with better key attributes.`;
            } else {
                upgradeRecommendation = 'Squad is well-balanced. Consider upgrading bench depth.';
            }
            
            return {
                score: finalScore,
                teamOVRScore: clampedTeamOVRScore,
                starterOVRScore: clampedStarterOVRScore,
                positionScore: clampedPositionScore,
                attrScore: avgAttrScore,
                balanceScore,
                depthScore,
                synergyScore,
                attackScore,
                midfieldScore,
                defenseScore,
                gkScore,
                weaknesses: weaknesses.slice(0, 3),
                upgradeRecommendation,
                tier: getTier(finalScore)
            };
        }

        // ---------- PERCENTILE (simulated) ----------
        function calculatePercentile(score, allAnalyses) {
            if (allAnalyses.length === 0) return 99;
            const scores = allAnalyses.map(a => a.score);
            scores.sort((a,b) => a - b);
            let lowerCount = scores.filter(s => s < score).length;
            return Math.round((lowerCount / scores.length) * 100);
        }

                                    <td>${new Date(item.createdAt).toLocaleDateString()}</td>
                                    <td>${item.teamName}</td>
                                    <td>${item.teamOVR}</td>
                                    <td><strong>${item.score}</strong></td>
                                    <td>${item.attackScore}</td>
                                    <td>${item.midfieldScore}</td>
                                    <td>${item.defenseScore}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>`}
                </div>
            `;
        }

        // ---------- EVENT LISTENERS ----------
        document.addEventListener('DOMContentLoaded', () => {
            // Navigation
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    navigate(link.dataset.page);
                });
            });
            
            // Global click for add player row in myteam (if needed)
            document.addEventListener('click', (e) => {
                if (e.target.matches('#playersList .btn-remove')) {
                    e.target.parentElement.remove();
                }
            });
            
            // Initial load
            navigate('dashboard');
        });

        // Make functions available globally for inline onclick
        window.navigate = navigate;
        window.addPlayerRow = addPlayerRow;
        window.saveTeamAndAnalyze = saveTeamAndAnalyze;
        window.performComparison = performComparison;
        window.calculateTeamRating = calculateTeamRating;
    </script>
</body>
</html>
